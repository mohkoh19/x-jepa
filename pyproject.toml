[tool.poetry]
name = "x-jepa"
version = "0.1.0"
description = "Latent Prediction Needs Alignment: A Controlled Study of Joint-Embedding Predictive Vision-Language Learning."
authors = ["Mohammad Kohankhaki, Daniel Kusuma"]
license = "CC-BY-NC-4.0"
readme = "README.md"
repository = "https://github.com/mohkoh19/x-jepa"
keywords = ["vision-language", "joint-embedding-predictive-architecture", "representation-learning", "retrieval"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
torch = ">=2.1.0"
torchvision = ">=0.16.0"
lightning = ">=2.2.0"
hydra-core = "1.3.2"
hydra-colorlog = "1.2.0"
rootutils = "*"
rich = "*"
pyyaml = ">=6.0"
numpy = ">=1.24"
transformers = ">=4.40"
datasets = ">=2.18"
pillow = ">=10.0"
omegaconf = ">=2.3"
webdataset = "^1.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "*"
coverage = "*"

[tool.poetry.scripts]
train = "src.train:main"
evaluate = "src.eval:main"

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = true
markers = [
  "slow: slow tests",
  "integration: tests that require external datasets or services",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
  "pragma: nocover",
  "raise NotImplementedError",
  "raise NotImplementedError()",
  "if __name__ == '__main__':",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
