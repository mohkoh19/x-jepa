_target_: src.data.coco_karpathy_datamodule.CocoKarpathyRetrievalDataModule
annotation_dir: ${paths.data_dir}/coco/karpathy_splits
image_root: ${paths.data_dir}/coco/images
batch_size: 128
num_workers: 10
pin_memory: True
max_words: 64
train_file: coco_karpathy_train.json
val_file: coco_karpathy_val.json
test_file: coco_karpathy_test.json
eval_split: test

train_transform:
  _target_: src.utils.ijepa.transforms.make_train_transform
  crop_size: 224
  crop_scale: [0.5, 1.0]

val_transform:
  _target_: src.utils.ijepa.transforms.make_eval_transform
  resize_size: 256
  crop_size: 224
