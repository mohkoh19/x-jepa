defaults:
  - model_checkpoint
  - model_summary
  - rich_progress_bar
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: null
  mode: "max"
  save_last: True
  save_top_k: -1
  auto_insert_metric_name: False
  every_n_epochs: 2

model_summary:
  max_depth: 2
