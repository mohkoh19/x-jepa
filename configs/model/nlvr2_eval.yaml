_target_: src.evaluation.nlvr2.NLVR2Evaluator
ckpt_path: ${ckpt_path}
mode: token_interaction
freeze_backbone: true
bert_size: auto
max_text_len: 64
feature_dim: 768
hidden_dim: 1536
dropout: 0.1
lr: 1e-4
weight_decay: 0.01
metric_prefix: ""
load_best_val_before_test: True
encoder_source: target
feature_projection: raw
token_interaction_dim: 256
token_interaction_layers: 2
token_interaction_heads: 4
token_interaction_mlp_ratio: 2.0
token_interaction_classifier_hidden_dim: 512
token_interaction_image_pool: 2
token_interaction_max_position_embeddings: 512
