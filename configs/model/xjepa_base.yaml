# Shared encoder envelope and optimization settings for the X-JEPA variants.
#
# Matched controls reported in the paper:
#   ViT-B/16 (ImageNet-1K init) + BERT-base-uncased + shared cross-modal predictor
#   AdamW (0.9, 0.98) / eps 1e-6, weight decay 0.01
#   20 epochs with a 4-epoch warmup, encoder peak LR 5e-5, head/temperature peak LR 5e-4
_target_: src.models.xjepa.XJEPA

ipe_scale: 2.0
warmup: 4
unfreeze_last_n: -1
max_text_len: 64

# Direct global image-text alignment weight (lambda).  The [P,A] variant sets a
# positive value; [P] and [TC] keep alignment disabled.
alignment_lambda: 0.0

# Global projection heads used for direct alignment and for retrieval features.
projection_dim: 768
projection_hidden_dim: 1024

# Cross-modal prediction setup.
prediction_directions: both
predictor_embed_dim: 384
predictor_depth: 4
predictor_num_heads: 2
predictor_block_impl: sdpa

# BERT-base-uncased [PAD], [UNK], [CLS] and [SEP] tokens are excluded from the
# text-side prediction targets.
text_special_token_ids: [0, 100, 101, 102]

optimizer_groups:
  encoder:
    lr_mult: 1.0
    wd_mult: 1.0
  prediction_head:
    lr_mult: 10.0
    wd_mult: 1.0
  projection_head:
    lr_mult: 10.0
    wd_mult: 1.0
  temperature:
    lr_mult: 10.0
    wd_mult: 0.0

vis_encoder:
  _target_: src.models.components.torchvision_vit.torchvision_vit_b_16
  img_size: 224

vision_pretrained:
  source: torchvision
  id: vit_b_16:IMAGENET1K_V1
  init_target: copy_online
  strict: true

text_encoder:
  _target_: src.models.components.multimodal_encoder.init_text_encoder
  size: bert-base-uncased
  load_pretrained: true

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 5e-5
  weight_decay: 0.01
  betas: [0.9, 0.98]
  eps: 1e-6

lr_scheduler_vis:
  _target_: src.utils.ijepa.schedulers.WarmupCosineSchedule
  _partial_: true
  start_lr: 1e-6
  ref_lr: 5e-5
  final_lr: 1e-6

lr_scheduler_text:
  _target_: src.utils.ijepa.schedulers.WarmupCosineSchedule
  _partial_: true
  start_lr: 5e-7
  ref_lr: 5e-5
  final_lr: 1e-6

momentum_scheduler:
  _target_: src.utils.ijepa.schedulers.MomentumScheduler
  _partial_: true
  base_m: 0.996
  final_m: 1.0
