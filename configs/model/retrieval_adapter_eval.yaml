_target_: src.evaluation.retrieval.RetrievalAdapterTuneEvaluator
ckpt_path: ${ckpt_path}
metric: coco_karpathy
mode: zeroshot
protocol: zeroshot
freeze_backbone: true
bert_size: auto
max_text_len: 64
text_batch_size: 256
feature_dim: 768
projection_dim: 768
lr: 1e-3
weight_decay: 0.01
logit_scale_init: 2.6592
encoder_source: target
validation_metric_prefix: null
test_metric_prefix: null
load_best_val_before_test: true
adapter_head: residual
residual_scale_init: 0.0
log_epoch0_metrics: true
score: itc
