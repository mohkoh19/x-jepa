# @package _global_

defaults:
  - override /data: sugarcrepe_pp
  - override /model: sugarcrepe_eval
  - override /trainer: gpu

task_name: eval_sugarcrepe_pp
tags: ["sugarcrepe++", "zero-shot"]

trainer:
  min_epochs: 0
  max_epochs: 0
  precision: 32
  num_sanity_val_steps: 0

evaluation:
  fit: false
  validate: true
  test: false
  metric_prefix: eval/sugarcrepe
  protocol: zeroshot
  backbone_frozen: true
  trainable: []
  selection_split: null
  final_split: sugarcrepe_pp
  image_resolution: 224
  external_reference: false
